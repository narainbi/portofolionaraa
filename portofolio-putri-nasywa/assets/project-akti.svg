<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="600" height="380">
  <defs>
    <linearGradient id="aktiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="bookCover" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="10%" stop-color="#0f172a"/>
      <stop offset="90%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>

  <rect width="600" height="380" rx="20" fill="url(#aktiBg)"/>

  <!-- Ambient Glow -->
  <circle cx="480" cy="90" r="140" fill="#14b8a6" opacity="0.2" filter="blur(40px)"/>
  <circle cx="100" cy="300" r="120" fill="#eab308" opacity="0.15" filter="blur(40px)"/>

  <!-- Decorative Layout -->
  <g transform="translate(60, 45)">
    <!-- Book 3D Mockup -->
    <g transform="translate(40, 20)">
      <!-- Pages thickness -->
      <polygon points="170,30 200,10 200,240 170,260" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1"/>
      <polygon points="170,260 200,240 70,240 40,260" fill="#e2e8f0"/>
      <!-- Book Front Cover -->
      <rect x="20" y="20" width="155" height="235" rx="6" fill="url(#bookCover)" stroke="url(#goldGrad)" stroke-width="2"/>
      
      <!-- Book Details -->
      <rect x="35" y="35" width="125" height="40" rx="4" fill="rgba(20, 184, 166, 0.2)"/>
      <text x="97" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#5eead4" text-anchor="middle">AKTI TOYOTA</text>
      
      <circle cx="97" cy="120" r="32" fill="url(#goldGrad)" opacity="0.9"/>
      <text x="97" y="127" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="900" fill="#0f172a" text-anchor="middle">10</text>
      <text x="97" y="140" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="700" fill="#0f172a" text-anchor="middle">DEKADE</text>
      
      <text x="97" y="185" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#f8fafc" text-anchor="middle">MEMBINA TALENTA</text>
      <text x="97" y="200" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="500" fill="#94a3b8" text-anchor="middle">MANUFAKTUR UNGGUL</text>

      <rect x="35" y="222" width="125" height="15" rx="3" fill="rgba(255,255,255,0.08)"/>
      <text x="97" y="233" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" font-weight="600" fill="#fde047" text-anchor="middle">TIM PENULIS BUKU</text>
    </g>

    <!-- Right Side Information & Editorial Features -->
    <g transform="translate(250, 20)">
      <rect width="210" height="240" rx="14" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(20, 184, 166, 0.3)" stroke-width="1.5"/>
      <text x="22" y="36" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" fill="#f8fafc">Dokumentasi 1 Dekade</text>
      <text x="22" y="54" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="500" fill="#14b8a6">Akademi Komunitas Toyota Indonesia</text>
      
      <g transform="translate(20, 75)">
        <circle cx="10" cy="10" r="10" fill="rgba(20, 184, 166, 0.2)"/>
        <text x="10" y="14" font-size="10" fill="#5eead4" text-anchor="middle">✓</text>
        <text x="28" y="13" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#e2e8f0">Riset Wawancara Pimpinan</text>
      </g>

      <g transform="translate(20, 115)">
        <circle cx="10" cy="10" r="10" fill="rgba(20, 184, 166, 0.2)"/>
        <text x="10" y="14" font-size="10" fill="#5eead4" text-anchor="middle">✓</text>
        <text x="28" y="13" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#e2e8f0">Penyelarasan Tone Narasi</text>
      </g>

      <g transform="translate(20, 155)">
        <circle cx="10" cy="10" r="10" fill="rgba(20, 184, 166, 0.2)"/>
        <text x="10" y="14" font-size="10" fill="#5eead4" text-anchor="middle">✓</text>
        <text x="28" y="13" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#e2e8f0">Monitoring Progres Bab</text>
      </g>

      <rect x="20" y="195" width="170" height="28" rx="6" fill="rgba(234, 179, 8, 0.15)" stroke="rgba(234, 179, 8, 0.4)"/>
      <text x="105" y="213" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="700" fill="#fde047" text-anchor="middle">Toyota Way • Kaizen • L&D</text>
    </g>
  </g>
</svg>

