<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="600" height="380">
  <defs>
    <linearGradient id="lpkaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="lpkaAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.9)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.9)"/>
    </linearGradient>
  </defs>

  <rect width="600" height="380" rx="20" fill="url(#lpkaBg)"/>

  <!-- Glowing background elements -->
  <circle cx="100" cy="80" r="120" fill="#6366f1" opacity="0.18" filter="blur(40px)"/>
  <circle cx="500" cy="300" r="130" fill="#ec4899" opacity="0.15" filter="blur(40px)"/>

  <!-- Grid decoration -->
  <g stroke="rgba(255,255,255,0.05)" stroke-width="1">
    <line x1="50" y1="0" x2="50" y2="380"/>
    <line x1="150" y1="0" x2="150" y2="380"/>
    <line x1="250" y1="0" x2="250" y2="380"/>
    <line x1="350" y1="0" x2="350" y2="380"/>
    <line x1="450" y1="0" x2="450" y2="380"/>
    <line x1="550" y1="0" x2="550" y2="380"/>
    <line x1="0" y1="60" x2="600" y2="60"/>
    <line x1="0" y1="160" x2="600" y2="160"/>
    <line x1="0" y1="260" x2="600" y2="260"/>
  </g>

  <!-- Central Assessment Dashboard Card -->
  <g transform="translate(60, 40)">
    <rect width="480" height="300" rx="16" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    
    <!-- Header of Mockup -->
    <rect width="480" height="45" rx="16" fill="rgba(15, 23, 42, 0.8)"/>
    <circle cx="25" cy="22" r="5" fill="#ef4444"/>
    <circle cx="42" cy="22" r="5" fill="#f59e0b"/>
    <circle cx="59" cy="22" r="5" fill="#10b981"/>
    <text x="85" y="27" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#94a3b8">LPKA Psychological Assessment System • Binus IO Psychology</text>
    
    <!-- Left Column: Interview & Observation Protocol -->
    <g transform="translate(30, 70)">
      <rect width="200" height="195" rx="12" fill="rgba(30, 41, 59, 0.6)" stroke="rgba(99, 102, 241, 0.3)"/>
      <text x="20" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Observasi & Interview</text>
      
      <!-- Progress Bar 1 -->
      <text x="20" y="65" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#94a3b8">Perilaku Adaptif</text>
      <rect x="20" y="73" width="160" height="8" rx="4" fill="rgba(255,255,255,0.1)"/>
      <rect x="20" y="73" width="135" height="8" rx="4" fill="url(#lpkaAccent)"/>
      
      <!-- Progress Bar 2 -->
      <text x="20" y="105" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#94a3b8">Regulasi Emosional</text>
      <rect x="20" y="113" width="160" height="8" rx="4" fill="rgba(255,255,255,0.1)"/>
      <rect x="20" y="113" width="118" height="8" rx="4" fill="#38bdf8"/>
      
      <!-- Progress Bar 3 -->
      <text x="20" y="145" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#94a3b8">Kesiapan Rehabilitasi</text>
      <rect x="20" y="153" width="160" height="8" rx="4" fill="rgba(255,255,255,0.1)"/>
      <rect x="20" y="153" width="145" height="8" rx="4" fill="#10b981"/>
    </g>

    <!-- Right Column: Visual Psychological Profile Radar / Chart -->
    <g transform="translate(250, 70)">
      <rect width="200" height="195" rx="12" fill="rgba(30, 41, 59, 0.6)" stroke="rgba(168, 85, 247, 0.3)"/>
      <text x="20" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Pemetaan Profil Binaan</text>
      
      <!-- Radar Polygon Mockup -->
      <polygon points="100,60 160,95 140,165 60,165 40,95" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
      <polygon points="100,75 145,100 130,150 70,150 55,100" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <polygon points="100,68 152,98 128,158 64,152 48,97" fill="rgba(168, 85, 247, 0.35)" stroke="#c084fc" stroke-width="2"/>
      
      <!-- Data tags -->
      <circle cx="100" cy="68" r="4" fill="#38bdf8"/>
      <circle cx="152" cy="98" r="4" fill="#ec4899"/>
      <circle cx="128" cy="158" r="4" fill="#10b981"/>
      <circle cx="64" cy="152" r="4" fill="#f59e0b"/>
      <circle cx="48" cy="97" r="4" fill="#818cf8"/>
      
      <rect x="20" y="172" width="160" height="18" rx="9" fill="rgba(99, 102, 241, 0.2)"/>
      <text x="100" y="184" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#a5b4fc" text-anchor="middle">Metode Asesmen Observasi Teruji</text>
    </g>
  </g>
</svg>

