<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="600" height="380">
  <defs>
    <linearGradient id="pdiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091e3a"/>
      <stop offset="50%" stop-color="#0f2b48"/>
      <stop offset="100%" stop-color="#051329"/>
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="tealGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
  </defs>

  <rect width="600" height="380" rx="20" fill="url(#pdiBg)"/>

  <!-- Glowing Aura -->
  <circle cx="150" cy="80" r="130" fill="#38bdf8" opacity="0.15" filter="blur(40px)"/>
  <circle cx="450" cy="280" r="140" fill="#2dd4bf" opacity="0.15" filter="blur(40px)"/>

  <!-- Main System Dashboard Card -->
  <g transform="translate(60, 40)">
    <rect width="480" height="300" rx="16" fill="rgba(15, 23, 42, 0.88)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.5"/>

    <!-- Window bar -->
    <rect width="480" height="42" rx="16" fill="rgba(30, 41, 59, 0.9)"/>
    <circle cx="25" cy="21" r="5" fill="#ef4444"/>
    <circle cx="42" cy="21" r="5" fill="#f59e0b"/>
    <circle cx="59" cy="21" r="5" fill="#10b981"/>
    <text x="85" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">AKTI Talent Monitoring & Genba Feedback System (PDI)</text>

    <!-- Stat KPI Row -->
    <g transform="translate(25, 60)">
      <!-- KPI 1 -->
      <rect width="135" height="60" rx="8" fill="rgba(30, 41, 59, 0.7)" stroke="rgba(56, 189, 248, 0.25)"/>
      <text x="14" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#94a3b8">Genba Monitoring</text>
      <text x="14" y="47" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="800" fill="#38bdf8">100% On-Track</text>

      <!-- KPI 2 -->
      <rect x="150" width="135" height="60" rx="8" fill="rgba(30, 41, 59, 0.7)" stroke="rgba(45, 212, 191, 0.25)"/>
      <text x="164" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#94a3b8">Activity Report Book</text>
      <text x="164" y="47" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="800" fill="#2dd4bf">Verified</text>

      <!-- KPI 3 -->
      <rect x="300" width="130" height="60" rx="8" fill="rgba(30, 41, 59, 0.7)" stroke="rgba(168, 85, 247, 0.25)"/>
      <text x="314" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#94a3b8">PDI Target Plan</text>
      <text x="314" y="47" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="800" fill="#c084fc">Competent</text>
    </g>

    <!-- Bottom Chart / Matrix View -->
    <g transform="translate(25, 135)">
      <rect width="430" height="140" rx="10" fill="rgba(30, 41, 59, 0.5)" stroke="rgba(255, 255, 255, 0.08)"/>
      
      <!-- Graph Lines -->
      <text x="20" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Grafik Progres Evaluasi Talenta Alumni AKTI</text>
      
      <!-- SVG Trend Line Chart -->
      <path d="M 30 110 L 100 90 L 180 95 L 260 65 L 340 50 L 400 35" fill="none" stroke="url(#blueGlow)" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M 30 110 L 100 90 L 180 95 L 260 65 L 340 50 L 400 35 L 400 120 L 30 120 Z" fill="rgba(56, 189, 248, 0.1)"/>
      
      <!-- Data Dots -->
      <circle cx="30" cy="110" r="5" fill="#38bdf8"/>
      <circle cx="100" cy="90" r="5" fill="#38bdf8"/>
      <circle cx="180" cy="95" r="5" fill="#38bdf8"/>
      <circle cx="260" cy="65" r="5" fill="#38bdf8"/>
      <circle cx="340" cy="50" r="5" fill="#2dd4bf"/>
      <circle cx="400" cy="35" r="6" fill="#10b981"/>

      <!-- Baseline -->
      <line x1="30" y1="120" x2="400" y2="120" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    </g>
  </g>
</svg>

