<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="600" height="380">
  <defs>
    <linearGradient id="learnBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180d38"/>
      <stop offset="50%" stop-color="#2d1354"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <rect width="600" height="380" rx="20" fill="url(#learnBg)"/>

  <!-- Glow -->
  <circle cx="120" cy="100" r="130" fill="#a855f7" opacity="0.18" filter="blur(40px)"/>
  <circle cx="500" cy="280" r="140" fill="#ec4899" opacity="0.15" filter="blur(40px)"/>

  <!-- Main Video Player & Learning Canvas Card -->
  <g transform="translate(60, 40)">
    <rect width="480" height="300" rx="16" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(168, 85, 247, 0.35)" stroke-width="1.5"/>

    <!-- Header bar -->
    <rect width="480" height="42" rx="16" fill="rgba(30, 41, 59, 0.9)"/>
    <circle cx="25" cy="21" r="5" fill="#ef4444"/>
    <circle cx="42" cy="21" r="5" fill="#f59e0b"/>
    <circle cx="59" cy="21" r="5" fill="#10b981"/>
    <text x="85" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">Binus Learning Support • Interactive Psychology Video Module</text>

    <!-- Video Screen Mockup Left -->
    <g transform="translate(25, 60)">
      <rect width="260" height="170" rx="10" fill="#020617" stroke="rgba(255,255,255,0.1)"/>
      
      <!-- Video Play Button Circle -->
      <circle cx="130" cy="85" r="28" fill="url(#purpleGlow)"/>
      <polygon points="124,73 142,85 124,97" fill="#ffffff"/>

      <!-- Video Timeline Bar -->
      <rect x="15" y="148" width="230" height="6" rx="3" fill="rgba(255,255,255,0.2)"/>
      <rect x="15" y="148" width="145" height="6" rx="3" fill="#a855f7"/>
      <circle cx="160" cy="151" r="5" fill="#ffffff"/>

      <!-- Video Title overlay -->
      <rect x="15" y="15" width="120" height="20" rx="4" fill="rgba(0,0,0,0.6)"/>
      <text x="25" y="29" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#f8fafc">IO Psychology Ep. 04</text>
    </g>

    <!-- Module List Right -->
    <g transform="translate(300, 60)">
      <rect width="155" height="170" rx="10" fill="rgba(30, 41, 59, 0.6)" stroke="rgba(168, 85, 247, 0.2)"/>
      <text x="14" y="25" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#f8fafc">Modul Pembelajaran</text>
      
      <rect x="12" y="38" width="131" height="28" rx="6" fill="rgba(168, 85, 247, 0.2)"/>
      <text x="20" y="55" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#e9d5ff">1. Assessment Center</text>

      <rect x="12" y="72" width="131" height="28" rx="6" fill="rgba(255,255,255,0.05)"/>
      <text x="20" y="89" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="500" fill="#cbd5e1">2. HPT & Performance</text>

      <rect x="12" y="106" width="131" height="28" rx="6" fill="rgba(255,255,255,0.05)"/>
      <text x="20" y="123" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="500" fill="#cbd5e1">3. Talent Management</text>

      <rect x="12" y="140" width="131" height="20" rx="4" fill="rgba(56, 189, 248, 0.15)"/>
      <text x="77" y="153" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="600" fill="#38bdf8" text-anchor="middle">Observasi Kelas Aktif</text>
    </g>

    <!-- Bottom Features Tag -->
    <g transform="translate(25, 242)">
      <rect width="430" height="38" rx="8" fill="rgba(30, 41, 59, 0.4)"/>
      <text x="20" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="600" fill="#c084fc">✨ Rancangan Visual Canva & PowerPoint • Naskah Artikel Ilmiah Populer</text>
    </g>
  </g>
</svg>

